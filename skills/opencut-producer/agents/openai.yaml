interface:
  display_name: "OpenCut Producer"
  short_description: "Build reviewable clips with provider captions."
  default_prompt: "Use $opencut-producer to create three distinct polished OpenCut review candidates from these local video/audio assets, choose or run the approved subtitle provider, apply a suitable production preset, run preflight checks, then open the local review workspace for WYSIWYG review, preview approval, batch/final render, and export-package handoff."
